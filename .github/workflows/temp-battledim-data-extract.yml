name: Temporary BattLeDIM data extract

on:
  push:
    branches:
      - temp-battledim-data-extract-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-official-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download official BattLeDIM development and evaluation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p battledim
          base='https://zenodo.org/records/4017659/files'
          for f in \
            2018_SCADA_Flows.csv 2018_SCADA_Demands.csv 2018_SCADA_Levels.csv \
            2019_SCADA_Flows.csv 2019_SCADA_Demands.csv 2019_SCADA_Levels.csv \
            L-TOWN.inp dataset_configuration.yaml; do
            curl --fail --location --retry 5 --retry-delay 3 --output "battledim/$f" "$base/$f?download=1"
          done
          cd battledim
          printf '%s  %s\n' \
            'd0602c06946b46287e956f007e4264ee' '2018_SCADA_Flows.csv' \
            '8803afcb1da2428de169237be3d911fb' '2018_SCADA_Demands.csv' \
            '92a512d6749ddf66fd6d99f2bdde6cc4' '2018_SCADA_Levels.csv' \
            '28fc99fdcbf80fcd26079e7fe602d6dc' '2019_SCADA_Flows.csv' \
            'b3e111de397a1b06d33b8a9f13bc997d' '2019_SCADA_Demands.csv' \
            'e5a8050bd38729e4b7648b9d52abd5b1' '2019_SCADA_Levels.csv' \
            'bfbb16b8b463e0576200ba6ad360f68e' 'L-TOWN.inp' \
            '48486401f5b4d0447023f5ce5d242c52' 'dataset_configuration.yaml' \
            > MD5SUMS
          md5sum -c MD5SUMS
          sha256sum 2018_SCADA_Flows.csv 2018_SCADA_Demands.csv 2018_SCADA_Levels.csv 2019_SCADA_Flows.csv 2019_SCADA_Demands.csv 2019_SCADA_Levels.csv L-TOWN.inp dataset_configuration.yaml > SHA256SUMS
          ls -lh

      - name: Upload verified official inputs
        uses: actions/upload-artifact@v4
        with:
          name: battledim-development-and-evaluation-official
          path: battledim/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
